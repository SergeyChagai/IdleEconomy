[package]
name = "sergeychagai/idle-economy"
description = "Economy and progression system for Roblox: currencies, cost curves, prestige, offline income"
version = "0.1.0"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = ["**"]

[dependencies]
# Service/controller framework. Pinned to an exact version rather than a
# range: on a one-developer project an unexpected dependency bump is a lost
# evening, not a saved minute.
Knit = "sleitnick/knit@1.7.0"

# Studio-only suite (Sprint 5). Lives in Packages so Rojo can sync it; the
# console suite still uses the hand-written Lune runner (ADR-0004).
TestEZ = "roblox/testez@0.4.1"

[server-dependencies]
# DataStore persistence with session locking. Declared as a server dependency
# because the package itself is realm = "server": save data must never be
# replicated to clients, and Wally enforces that by putting it in
# ServerPackages instead of Packages.
ProfileStore = "lm-loleris/profilestore@1.0.3"
